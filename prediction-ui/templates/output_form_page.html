<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction of house price</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #4285f4, #34a8eb);
            padding: 24px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        h1 { margin: 0 0 8px; font-size: 22px; color: #1a2b49; }
        .price { font-size: 44px; font-weight: 700; color: #4285f4; margin: 16px 0 24px; }
        a {
            display: inline-block;
            padding: 10px 20px;
            color: #fff;
            background: #4285f4;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { background: #2f6fd6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>The predicted house price is</h1>
        <div class="price">${{ prediction_variable }}</div>
        <a href="/predicthouseprice">Make another prediction</a>
    </div>
</body>
</html>
